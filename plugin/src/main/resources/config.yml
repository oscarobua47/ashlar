# =============================================================================
# Ashlar configuration
#
# SECURITY WARNING: the port opened below is a raw, plaintext WebSocket.
# Anyone who can reach it and guess/steal the token can control this server.
#   - Always set a long, random `server.token`.
#   - Fill in `server.allowed-ips` when your MCP Server has a fixed IP (e.g. a
#     VPS). Leave it empty when it runs on a PC with a dynamic home IP.
#   - This plugin does NOT provide TLS. Put a reverse proxy (Caddy, Nginx,
#     Cloudflare Tunnel, ...) in front of it to terminate TLS if the
#     connection ever crosses an untrusted network. Do not expose this port
#     directly to the public internet without one.
# =============================================================================

# Language for everything the plugin itself says in chat (/ashlar usage/help lines, progress
# lines, the usage footer, limit/credit/pause messages, ...). Does not affect the AI's own replies,
# which already follow whatever language the player wrote in, or anything logged/sent over RPC.
#   en     = English (default).
#   zh_CN  = Simplified Chinese.
#   auto   = each player's own client language (falls back to English for anything not shipped
#            above); the console (including `ashlar simulate`) always sees English under "auto",
#            since it has no client locale to read.
# Picked up on the next restart; changing it does not require a full reconfigure.
language: en

# How this server is used. This one key decides whether the WebSocket server
# (the entry point for MCP clients such as Claude Desktop, Claude Code or
# OpenCode, via ashlar-mcp) runs, and what /ashlar does in game:
#   both     = WebSocket server on (needs server.token below) AND the in-game
#              assistant, run by the plugin itself using agent.model (default).
#   mcp      = WebSocket server only; /ashlar is disabled.
#   ingame   = /ashlar only: no WebSocket server, no port, no token needed.
#   external = WebSocket server on; /ashlar requests are forwarded to a
#              connected external process (the 0.2 layout, for integrators).
mode: both

server:
  # Interface to bind the WebSocket server to. "0.0.0.0" listens on all
  # interfaces; use "127.0.0.1" if the MCP Server runs on the same host.
  host: "0.0.0.0"

  # TCP port for the WebSocket server. Pick an idle port on your host/panel.
  port: 8765

  # The token clients must present on connect. Required unless mode is
  # "ingame": leave it empty and the plugin will refuse to start. Use a long
  # random value (>= 16 characters), e.g. `openssl rand -hex 24`.
  token: ""

  # Optional allow-list of client IP addresses. Empty list = no restriction
  # (the token is still required). Recommended when the MCP Server has a
  # fixed IP; leave empty when it runs on a PC with a dynamic home IP, since
  # the address would change and lock you out.
  allowed-ips: []

limits:
  # Maximum number of blocks a single fill_batch/set_blocks request may touch.
  max-blocks-per-operation: 500000

  # Maximum region volume read_region may return in a single call.
  max-read-volume: 200000

  # Maximum milliseconds of work performed per server tick by build tasks.
  tick-budget-ms: 20

  # Maximum number of operations that may be queued at once.
  max-queued-operations: 16

  # Maximum number of 16x16 chunk columns a single operation's bounding box
  # may force-load. Applies to fill_batch, set_blocks, read_region, snapshot,
  # restore (the snapshot's own region) and heightmap (x/z area, one y layer).
  # Prevents a thin, wide shape (e.g. a 1x1x500000 fill) from force-loading
  # thousands of chunks. 1024 chunks = a 512x512 block footprint, enough for
  # a 300x300 terrain survey; lower it on memory-constrained servers.
  max-chunks-per-operation: 1024

  # Maximum number of physics-enabled liquid blocks a single fill_batch/set_blocks request may
  # place with "liquids": "flow" (default "static" has no such cap). Each one schedules fluid
  # updates that spread on their own, so keep this small.
  max-flowing-liquids-per-operation: 2000

world:
  # Default world name used when a request omits "world".
  default: "world"

  # Whitelist of world names operations are allowed to touch.
  allowed-worlds: ["world"]

  # Optional bounding box that further restricts where builds may happen.
  build-region:
    enabled: false
    min: {x: -1000, z: -1000}
    max: {x: 1000, z: 1000}

snapshot:
  # Whether the snapshot/restore feature is available.
  enabled: true

  # Maximum number of snapshots kept on disk; oldest is evicted first.
  max-snapshots: 20

  # Maximum region volume that may be captured in a single snapshot.
  max-volume: 200000

logging:
  # Whether every executed operation is appended to operations.log.
  log-operations: true

run-command:
  # Whether the run_command RPC (arbitrary console command execution) is
  # enabled. This is an escape hatch with full console privileges; disable
  # it if you do not need it.
  enabled: true

engine:
  # Whether fill_batch/set_blocks run a shape-only connection pass after
  # writing, so glass panes, fences, walls, iron bars and stairs connect to
  # their neighbours like hand-placed blocks. Overridable per-request via
  # "connect": false in a fill_batch/set_blocks call.
  connect-blocks: true

  # Whether fill_batch/set_blocks/restore run a post-build support check:
  # since blocks are written without physics, a ladder with nothing behind
  # it or a torch buried in a wall would silently stay put instead of
  # popping off as it would in vanilla. The check reports such blocks as
  # "warnings" in the RPC result instead of fixing or rejecting anything.
  # No per-request override (unlike connect-blocks).
  support-warnings: true

agent:
  # The in-game assistant: players with the ashlar.use permission can type
  # "/ashlar <request>". Whether it runs is decided by the top-level `mode`.

  # Only used when mode is "both" or "ingame".
  model:
    # OpenAI-compatible base URL; "/chat/completions" is appended. No
    # trailing slash needed.
    base-url: "https://api.deepseek.com"

    # Required for the in-game assistant. Leave empty and /ashlar will reply that the
    # assistant is not configured, instead of refusing to start.
    api-key: ""

    # Model name sent in each request.
    model: "deepseek-flash"

    # Per-request tool-call budget; once reached the model gets one last
    # turn with tool calls disabled to summarise what it did.
    max-tool-calls: 25

    # Timeout for a single model API call, in milliseconds.
    request-timeout-ms: 120000

    # Detail level passed for images sent to the model: low, high, or auto.
    image-detail: "high"

    # Optional path to a text file appended to the built-in system prompt.
    # Leave empty to use the built-in prompt as-is.
    system-prompt-file: ""

    # Whether mc_command (arbitrary console command execution) is offered to
    # the model as a tool. Off by default even if run-command.enabled above
    # is true, since it gives the model direct console access.
    allow-command: false

  # Only used when mode is "both" or "ingame".
  limits:
    # Maximum requests one player may start per day (UTC), counted by UUID.
    # 0 = unlimited.
    max-requests-per-player-per-day: 40

    # Maximum tokens (input + cached + output) one player may use per day.
    # 0 = unlimited.
    max-tokens-per-player-per-day: 0

    # Maximum cost (in agent.pricing.currency) one player may incur per day.
    # 0 = unlimited.
    max-cost-per-player-per-day: 0

    # Requests running at once across all players.
    max-concurrent: 2

    # User/assistant exchanges remembered per player between requests.
    history-turns: 6

    # A player's remembered history is forgotten after this many minutes of
    # inactivity.
    history-ttl-minutes: 30

  # Only used when mode is "both" or "ingame". Pricing feeds the cost shown in each
  # reply's footer and the max-cost-per-player-per-day limit above.
  pricing:
    # USD (or "currency" below) per 1,000,000 uncached input tokens, at peak
    # price.
    input: 0.30

    # Per 1,000,000 cached input tokens, at peak price.
    cached-input: 0.006

    # Per 1,000,000 output tokens, at peak price.
    output: 1.20

    # Label only: "USD" is shown as "$"; anything else is shown as
    # "<code> " before the amount.
    currency: "USD"

    # UTC windows in which the prices above apply at full (peak) price;
    # outside them, off-peak-multiplier is applied instead. Format: an
    # optional day range (mon-fri, sat-sun, daily; default daily) followed
    # by comma-separated HH:MM-HH:MM windows. "always" disables the
    # off-peak discount entirely.
    peak-hours: "mon-fri 01:00-04:00,06:00-10:00"

    # Price multiplier applied outside the peak-hours windows.
    off-peak-multiplier: 0.5

  # Minimum seconds between two requests from the same player.
  cooldown-seconds: 5

  # Longest request text accepted, in characters.
  max-message-length: 500

  # Whether players with the ashlar.monitor permission (default op) see a
  # compact echo of every /ashlar request and every final reply from other
  # players - "<name> asked: ..." and "[Ashlar -> <name>] ...". Monitors
  # never see progress lines, and never see an echo of their own requests.
  echo-to-monitors: true

  # true = every player may use /ashlar; false (default) = only operators,
  # players granted the ashlar.use permission (e.g. via LuckPerms), or
  # players on the plugin's own allow list (/ashlar allow <player>).
  everyone-can-use: false
