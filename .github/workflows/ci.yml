name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  plugin:
    name: Build plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # mc_build's `text` renders non-ASCII lettering through the JVM's system fonts; a bare
      # runner has none, so those tests would skip themselves (see AwtGlyphsTest). Installing a
      # CJK font here keeps that path actually covered on Linux.
      - name: Install a CJK font for the lettering tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Build with Gradle (includes unit tests)
        working-directory: plugin
        run: ./gradlew build --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: ashlar-plugin
          path: plugin/build/libs/*.jar
          if-no-files-found: error

  mcp-server:
    name: Build and test MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci --omit=optional

      - name: Build
        working-directory: mcp-server
        run: npm run build

      - name: Test
        working-directory: mcp-server
        run: npm test
