name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-plugin:
    name: Build plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build with Gradle (includes unit tests)
        working-directory: plugin
        env:
          ASHLAR_RELEASE: "1"
        run: ./gradlew build --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: plugin/build/libs/*.jar
          if-no-files-found: error

  build-mcp-server:
    name: Build and pack MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci --omit=optional

      - name: Build
        working-directory: mcp-server
        run: npm run build

      - name: Test
        working-directory: mcp-server
        run: npm test

      - name: Pack npm tarball
        working-directory: mcp-server
        run: |
          npm pack
          mv ashlar-mcp-*.tgz "mcp-server-${GITHUB_REF_NAME}.tgz"

      - name: Upload mcp-server tarball
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-tarball
          path: mcp-server/mcp-server-*.tgz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-plugin, build-mcp-server]
    runs-on: ubuntu-latest
    steps:
      - name: Download plugin jar
        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: release-assets

      - name: Download mcp-server tarball
        uses: actions/download-artifact@v4
        with:
          name: mcp-server-tarball
          path: release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Install instructions: https://github.com/${{ github.repository }}/blob/main/README.md#install-three-steps"
